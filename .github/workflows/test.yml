name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Verify required tools are present
        run: |
          command -v bash
          command -v jq
          command -v python3
          command -v awk
          command -v find

      - name: Run regression suite
        run: bash tests/test-session-aware.sh
