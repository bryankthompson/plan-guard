name: bump-self-pin

# After every push to main, automatically bump
# .claude-plugin/marketplace.json `.plugins[0].source.sha` to point at the
# current main HEAD. This closes the self-referencing-marketplace one-commit
# lag where the SHA-bump commit can't pin itself.
#
# The workflow's own commits are gated out by message-prefix to prevent a
# loop. As a second-line defense, GitHub's policy that pushes via
# GITHUB_TOKEN do not trigger downstream workflow runs also breaks the loop
# at the platform level.
#
# Bump commits carry [skip ci] so the tests workflow doesn't re-run on a
# no-op marketplace.json change (the tests don't read marketplace.json).

on:
  push:
    branches: [main]

# Only one bump in flight at a time; if a newer push lands while we're
# running, cancel us — the newer run will pick up the latest HEAD anyway.
concurrency:
  group: bump-self-pin
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # Loop guard: skip when our own bump commit re-triggered the workflow.
    # In practice GitHub's GITHUB_TOKEN push policy already prevents this,
    # but the prefix check is a cheap belt-and-suspenders.
    # YAML-quote the whole expression: the colon inside the literal
    # 'marketplace: bump SHA pin' otherwise confuses the YAML parser.
    if: "${{ !startsWith(github.event.head_commit.message, 'marketplace: bump SHA pin') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check pin vs HEAD
        id: check
        run: |
          current_sha=$(jq -r '.plugins[0].source.sha' .claude-plugin/marketplace.json)
          head_sha=$(git rev-parse HEAD)
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          if [ "$current_sha" = "$head_sha" ]; then
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            echo "Pin already matches HEAD — nothing to do."
          else
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
            echo "Pin will bump: $current_sha -> $head_sha"
          fi

      - name: Bump pin
        if: steps.check.outputs.needs_bump == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Atomic write — jq to temp, mv into place
          jq --arg sha "${{ steps.check.outputs.head_sha }}" \
            '.plugins[0].source.sha = $sha' \
            .claude-plugin/marketplace.json > .claude-plugin/marketplace.json.new
          mv .claude-plugin/marketplace.json.new .claude-plugin/marketplace.json

          git add .claude-plugin/marketplace.json
          git commit -m "marketplace: bump SHA pin to ${{ steps.check.outputs.head_sha }} [skip ci]

          [auto] Self-pin follows main HEAD after merge. Generated by
          .github/workflows/bump-self-pin.yml — see workflow comments
          for the loop-prevention design."

          git push
